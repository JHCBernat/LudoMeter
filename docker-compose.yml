version: '3.8'

services:
  ludometer:
    build: .
    container_name: ludometer
    image: ludometer:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CHANNEL_ORG_ID=900499534109630484
      - DISCORD_CHANNEL_AGENDA_ID=1318237559213658164
    volumes:
      - ./data:/app/data
    networks:
      - ludometer-net

networks:
  ludometer-net:
    driver: bridge
